<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="LieMermaid — Render Mermaid diagrams (flowchart, sequence, class, state, ER, pie, gitgraph, timeline) to SVG/PNG entirely in your browser via WebAssembly.">
    <title>LieMermaid — Online Mermaid Editor</title>
    <link rel="icon" type="image/svg+xml"
        href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230d9488'/%3E%3Ccircle cx='9' cy='10' r='3' fill='white'/%3E%3Ccircle cx='23' cy='16' r='3' fill='white'/%3E%3Ccircle cx='11' cy='23' r='3' fill='white'/%3E%3Cpath d='M11.5 11.5l9 3.5M21.5 18.5l-8.5 3.5' stroke='white' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/editor/editor.main.css">
</head>

<body>
    <header class="app-header">
        <div class="brand">
            <svg class="brand-logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect width="32" height="32" rx="8" fill="url(#lm-grad)" />
                <circle cx="9" cy="10" r="2.8" stroke="white" stroke-width="2" />
                <circle cx="23" cy="16" r="2.8" stroke="white" stroke-width="2" />
                <circle cx="11" cy="23" r="2.8" stroke="white" stroke-width="2" />
                <path d="M11.4 11.6l9.2 3.6M21.6 18.6l-8.8 3.4" stroke="white" stroke-width="2"
                    stroke-linecap="round" />
                <defs>
                    <linearGradient id="lm-grad" x1="0" y1="0" x2="32" y2="32">
                        <stop offset="0%" stop-color="#14b8a6" />
                        <stop offset="100%" stop-color="#0f766e" />
                    </linearGradient>
                </defs>
            </svg>
            <div class="brand-text">
                <h1>LieMermaid</h1>
                <span class="tagline">Online Mermaid Editor</span>
            </div>
        </div>
        <nav class="header-nav">
            <a href="https://docs.rs/liemermaid" target="_blank" rel="noopener" class="nav-link">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                </svg>
                Docs
            </a>
            <a href="https://github.com/zzzdong/liemermaid" target="_blank" rel="noopener" class="nav-link">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                    <path
                        d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z" />
                </svg>
                GitHub
            </a>
        </nav>
    </header>

    <main class="workspace">
        <!-- Left Panel: Editor -->
        <section class="panel panel-editor">
            <div class="panel-toolbar">
                <div class="toolbar-group">
                    <label class="toolbar-label" for="chartType">Diagram</label>
                    <select id="chartType" class="toolbar-select">
                        <option value="flowchart">Flowchart</option>
                        <option value="sequence">Sequence</option>
                        <option value="class">Class</option>
                        <option value="state">State</option>
                        <option value="er">ER Diagram</option>
                        <option value="pie">Pie</option>
                        <option value="gitgraph">Git Graph</option>
                        <option value="timeline">Timeline</option>
                    </select>
                </div>
                <div class="toolbar-actions">
                    <button id="loadExample" class="btn btn-ghost">Reset</button>
                    <button id="generateBtn" class="btn btn-primary" disabled>
                        <span class="btn-spinner hidden"></span>
                        <span class="btn-text">Render</span>
                    </button>
                </div>
            </div>
            <div class="editor-surface">
                <div id="monacoEditor"></div>
            </div>
            <div id="errorPanel" class="error-toast hidden">
                <svg class="error-icon" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd"
                        d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z"
                        clip-rule="evenodd" />
                </svg>
                <span class="error-message"></span>
            </div>
        </section>

        <!-- Resize Handle -->
        <div class="resize-handle" id="resizeHandle"></div>

        <!-- Right Panel: Preview -->
        <section class="panel panel-preview">
            <div class="panel-toolbar">
                <div class="toolbar-group">
                    <label class="toolbar-label" for="renderMode">Format</label>
                    <select id="renderMode" class="toolbar-select">
                        <option value="svg">SVG</option>
                        <option value="png">PNG</option>
                    </select>
                </div>
                <div class="toolbar-actions">
                    <button id="downloadBtn" class="btn btn-ghost">
                        <svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor">
                            <path fill-rule="evenodd"
                                d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zm3.293-7.707a1 1 0 011.414 0L9 10.586V3a1 1 0 112 0v7.586l1.293-1.293a1 1 0 111.414 1.414l-3 3a1 1 0 01-1.414 0l-3-3a1 1 0 010-1.414z"
                                clip-rule="evenodd" />
                        </svg>
                        Download
                    </button>
                </div>
            </div>
            <div class="preview-surface">
                <div id="chartContainer" class="chart-stage">
                    <div class="empty-state">
                        <svg class="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                            stroke-width="1.5">
                            <circle cx="5" cy="6" r="2.5" />
                            <circle cx="19" cy="12" r="2.5" />
                            <circle cx="7" cy="18" r="2.5" />
                            <path d="M7.2 7.2l9.3 3.6M16.6 13.8l-7.4 3" />
                        </svg>
                        <p>Select a diagram type and click <strong>Render</strong></p>
                        <span class="shortcut-hint">Ctrl + Enter</span>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.0/min/vs/loader.js"></script>
    <script src="main.js"></script>
</body>

</html>
