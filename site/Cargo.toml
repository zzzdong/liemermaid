[package]
name = "liemermaid-site"
version = "0.1.0"
edition = "2024"
publish = false
description = "WASM playground for liemermaid: render Mermaid diagrams to SVG/PNG in the browser"
repository = "https://github.com/zzzdong/liemermaid"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
liemermaid = { path = ".." }
wasm-bindgen = "0.2"
