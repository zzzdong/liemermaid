[package]
name = "liemermaid"
version = "0.1.0-beta.1"
edition = "2024"
rust-version = "1.92"
description = "Mermaid diagram parser + renderer (SVG / vello_cpu PNG), unified through lievisual Scene IR."
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/liemermaid"
repository = "https://github.com/zzzdong/liemermaid"
homepage = "https://github.com/zzzdong/liemermaid"
keywords = ["mermaid", "diagram", "flowchart", "sequence", "graph"]
categories = ["visualization", "parser-implementations", "rendering"]
# 打包时排除 demo 产物
exclude = ["*.svg", "*.png"]

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
lievisual = "0.1"
parley = "0.11"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
vello_cpu = "0.2"
winnow = "1.0.4"

[dev-dependencies]
serde_json = "1"
quick-xml = "0.42"

[features]
default = ["serde"]

[[bin]]
name = "liemermaid"
path = "src/bin/liemermaid.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

#[patch.crates-io]
#lievisual = { path = "../lievisual" }