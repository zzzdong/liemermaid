[package]
name = "liemermaid"
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.92"
description = "Mermaid diagram parser + renderer (SVG / vello_cpu PNG), unified through lievisual Scene IR."
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/liemermaid"
repository = "https://github.com/zzzdong/liemermaid"
homepage = "https://github.com/zzzdong/liemermaid"
keywords = ["mermaid", "diagram", "flowchart", "sequence", "graph"]
categories = ["visualization", "parser-implementations", "rendering"]
# 打包时排除 demo 产物
exclude = ["*.svg", "*.png"]

[dependencies]
pest = "2.8.6"
pest_derive = "2.8.6"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
vello_cpu = "0.2"
parley = "0.11"
petgraph = "0.7"
# 发布时用 crates.io 上的 lievisual；本地开发用 path
lievisual = { version = "0.1.0-beta.1", path = "../lievisual" }

[dev-dependencies]
serde_json = "1"

[features]
default = ["serde"]
