[package]
name = "liemermaid"
version = "0.1.0-alpha.2"
edition = "2024"
rust-version = "1.92"
description = "Mermaid diagram parser + renderer (SVG / vello_cpu PNG), unified through lievisual Scene IR."
license = "Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/liemermaid"
repository = "https://github.com/zzzdong/liemermaid"
homepage = "https://github.com/zzzdong/liemermaid"
keywords = ["mermaid", "diagram", "flowchart", "sequence", "graph"]
categories = ["visualization", "parser-implementations", "rendering"]
# 打包时排除 demo 产物
exclude = ["*.svg", "*.png"]

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
vello_cpu = "0.2"
parley = "0.11"
petgraph = "0.7"
lievisual = { path = "../lievisual" }
winnow = "1.0.4"
dagre = "0.1"

[dev-dependencies]
serde_json = "1"
quick-xml = "0.36"

[features]
default = ["serde"]
