[package]
name = "liemermaid"
version = "0.1.0"
edition = "2024"

[dependencies]
pest = "2.8.6"
pest_derive = "2.8.6"
thiserror = "2"
serde = { version = "1", features = ["derive"], optional = true }
vello_cpu = "0.0.9"
parley = "0.9.0"
petgraph = "0.7"

[dev-dependencies]
serde_json = "1"

[features]
default = ["serde"]