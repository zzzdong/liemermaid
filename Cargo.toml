[package]
name = "liemermaid"
version = "0.3.0"
edition = "2024"
rust-version = "1.92"
description = "Mermaid diagram parser + renderer (SVG / vello_cpu PNG), unified through lievisual Scene IR."
license = "MIT OR Apache-2.0"
readme = "README.md"
documentation = "https://docs.rs/liemermaid"
repository = "https://github.com/zzzdong/liemermaid"
homepage = "https://github.com/zzzdong/liemermaid"
keywords = ["mermaid", "diagram", "flowchart", "sequence", "graph"]
categories = ["visualization", "parser-implementations", "rendering"]
# 说明：根目录的 demo 产物（*.svg / *.png）已被 .gitignore 忽略，
# 不再使用 `exclude = ["*.svg"]`——那会连 tests/golden/golden/*.svg 基线一起排除。

[dependencies]
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
lievisual = "0.3"
serde = { version = "1", features = ["derive"], optional = true }
thiserror = "2"
winnow = "1.0.4"

[dev-dependencies]
serde_json = "1"
quick-xml = "0.42"

[features]
default = ["serde"]

[[bin]]
name = "liemermaid-cli"
path = "src/bin/liemermaid.rs"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"

[workspace]
members = ["site"]
